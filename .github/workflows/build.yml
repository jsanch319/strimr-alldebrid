name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ios-build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure iOS build
        env:
          DISCORD_APPLICATION_CLIENT_ID: ${{ vars.DISCORD_APPLICATION_CLIENT_ID }}
          DISCORD_ACTIVITY_URL: ${{ vars.DISCORD_ACTIVITY_URL }}
        run: |
          cp Config/Config-example.xcconfig Config/Config.xcconfig
          printf '\nPRODUCT_BUNDLE_IDENTIFIER = app.strimr.alldebrid.ci\n' >> Config/Config.xcconfig
          if [[ -n "$DISCORD_APPLICATION_CLIENT_ID" ]]; then
            printf 'DISCORD_APPLICATION_CLIENT_ID = %s\n' "$DISCORD_APPLICATION_CLIENT_ID" >> Config/Config.xcconfig
          fi
          if [[ -n "$DISCORD_ACTIVITY_URL" ]]; then
            printf 'DISCORD_ACTIVITY_URL = %s\n' "$DISCORD_ACTIVITY_URL" >> Config/Config.xcconfig
          fi
          touch Config/Config-TopShelf.xcconfig

      - name: iOS build
        run: |
          xcodebuild \
            -project Strimr.xcodeproj \
            -scheme Strimr \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build

  tvos-build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tvOS build
        run: |
          xcodebuild \
            -project Strimr.xcodeproj \
            -scheme Strimr-tvOS \
            -destination 'generic/platform=tvOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

  macos-build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure macOS tests
        run: |
          cp Config/Config-example.xcconfig Config/Config.xcconfig
          printf '\nPRODUCT_BUNDLE_IDENTIFIER = app.strimr.ci\n' >> Config/Config.xcconfig
          touch Config/Config-TopShelf.xcconfig

      - name: macOS build and tests
        run: |
          xcodebuild \
            -project Strimr.xcodeproj \
            -scheme Strimr-macOS \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
