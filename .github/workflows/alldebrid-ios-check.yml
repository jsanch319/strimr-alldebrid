name: AllDebrid iOS compile check

on:
  workflow_dispatch:
  push:
    paths:
      - 'Shared/**'
      - 'Strimr-iOS/**'
      - 'Strimr.xcodeproj/**'
      - 'Config/**'
      - '.github/workflows/alldebrid-ios-check.yml'

permissions:
  contents: read

jobs:
  simulator-compile:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Prepare local build configuration
        env:
          DISCORD_APPLICATION_CLIENT_ID: ${{ vars.DISCORD_APPLICATION_CLIENT_ID }}
          DISCORD_ACTIVITY_URL: ${{ vars.DISCORD_ACTIVITY_URL }}
        run: |
          cp Config/Config-example.xcconfig Config/Config.xcconfig
          printf '\nPRODUCT_BUNDLE_IDENTIFIER = app.strimr.alldebrid.ci\n' >> Config/Config.xcconfig
          if [[ -n "$DISCORD_APPLICATION_CLIENT_ID" ]]; then
            printf 'DISCORD_APPLICATION_CLIENT_ID = %s\n' "$DISCORD_APPLICATION_CLIENT_ID" >> Config/Config.xcconfig
          fi
          if [[ -n "$DISCORD_ACTIVITY_URL" ]]; then
            printf 'DISCORD_ACTIVITY_URL = %s\n' "$DISCORD_ACTIVITY_URL" >> Config/Config.xcconfig
          fi
          touch Config/Config-TopShelf.xcconfig
      - name: Compile iOS simulator (no signing)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Strimr.xcodeproj \
            -scheme Strimr \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-output.log
      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-compile-log
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 7
