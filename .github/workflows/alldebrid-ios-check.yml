name: AllDebrid iOS compile check

on:
  workflow_dispatch:
  push:
    paths:
      - 'Shared/**'
      - 'Strimr-iOS/**'
      - 'StrimrVisualUITests/**'
      - 'Strimr.xcodeproj/**'
      - 'Config/**'
      - '.github/workflows/alldebrid-ios-check.yml'

permissions:
  contents: read

jobs:
  simulator-compile:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Prepare local build configuration
        env:
          DISCORD_APPLICATION_CLIENT_ID: ${{ vars.DISCORD_APPLICATION_CLIENT_ID }}
          DISCORD_ACTIVITY_URL: ${{ vars.DISCORD_ACTIVITY_URL }}
        run: |
          cp Config/Config-example.xcconfig Config/Config.xcconfig
          printf '\nPRODUCT_BUNDLE_IDENTIFIER = app.strimr.alldebrid.ci\n' >> Config/Config.xcconfig
          if [[ -n "$DISCORD_APPLICATION_CLIENT_ID" ]]; then
            printf 'DISCORD_APPLICATION_CLIENT_ID = %s\n' "$DISCORD_APPLICATION_CLIENT_ID" >> Config/Config.xcconfig
          fi
          if [[ -n "$DISCORD_ACTIVITY_URL" ]]; then
            printf 'DISCORD_ACTIVITY_URL = %s\n' "$DISCORD_ACTIVITY_URL" >> Config/Config.xcconfig
          fi
          touch Config/Config-TopShelf.xcconfig
      - name: Compile iOS simulator (no signing)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Strimr.xcodeproj \
            -scheme Strimr \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-output.log
      - name: Launch app on an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSMOKE'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          available = [(runtime, device) for runtime, rows in devices.items() if ".iOS-" in runtime for device in rows if device["name"].startswith("iPhone") and device.get("deviceTypeIdentifier")]
          if not available:
              print("No installed iPhone simulator runtime: launch behavior remains unverified.")
              raise SystemExit(0)
          runtime, device = available[0]
          identifier = subprocess.check_output(["xcrun", "simctl", "create", "Strimr launch smoke", device["deviceTypeIdentifier"], runtime], text=True).strip()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("STRIMR_SMOKE_ID=" + identifier + "\n")
          subprocess.run(["xcrun", "simctl", "boot", identifier], check=True)
          subprocess.run(["xcrun", "simctl", "bootstatus", identifier, "-b"], check=True)
          app = "build/DerivedData/Build/Products/Debug-iphonesimulator/Strimr-iOS.app"
          bundle = subprocess.check_output(["/usr/libexec/PlistBuddy", "-c", "Print CFBundleIdentifier", app + "/Info.plist"], text=True).strip()
          subprocess.run(["xcrun", "simctl", "install", identifier, app], check=True)
          subprocess.run(["xcrun", "simctl", "launch", identifier, bundle], check=True)
          import time
          time.sleep(3)
          processes = subprocess.check_output(["xcrun", "simctl", "spawn", identifier, "launchctl", "list"], text=True)
          running = [line.split() for line in processes.splitlines() if bundle in line]
          if not any(row and row[0].isdigit() and int(row[0]) > 0 for row in running):
              raise RuntimeError("The app exited immediately after simulator launch")
          subprocess.run(["xcrun", "simctl", "io", identifier, "screenshot", "build/ios-launch-smoke.png"], check=True)
          print("iOS app startup smoke passed. This fresh simulator has no user API credentials; authenticated catalog interactions are not covered.")
          PYSMOKE
      - name: Test credential-free catalog interactions and capture screens
        if: env.STRIMR_SMOKE_ID != ''
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project Strimr.xcodeproj \
            -scheme Strimr-VisualTests \
            -destination "platform=iOS Simulator,id=$STRIMR_SMOKE_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/CatalogVisualTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/visual-tests.log
      - name: Export visual test screenshots
        if: always()
        shell: bash
        run: |
          if [[ -d build/CatalogVisualTests.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/CatalogVisualTests.xcresult --output-path build/screenshots
          fi
      - name: Upload visual screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-catalog-visual-tests
          path: |
            build/screenshots
            build/visual-tests.log
            build/CatalogVisualTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
      - name: Clean up launch simulator
        if: always() && env.STRIMR_SMOKE_ID != ''
        shell: bash
        run: |
          xcrun simctl shutdown "$STRIMR_SMOKE_ID" || true
          xcrun simctl delete "$STRIMR_SMOKE_ID" || true
      - name: Upload iOS launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-smoke
          path: build/ios-launch-smoke.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-compile-log
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 7
